name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''
      release_notes:
        description: 'Release Notes summary'
        required: false
        default: 'Automated release build of MB Nursing Home HMS Android APK.'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-output
          VERSION_TAG="${{ github.event.inputs.release_version }}"
          if [ -z "$VERSION_TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              VERSION_TAG="${{ github.ref_name }}"
            else
              VERSION_TAG="v1.0.${{ github.run_number }}"
            fi
          fi
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/mb-nursing-home-hms-${VERSION_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk release-output/mb-nursing-home-hms-latest.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v5
        with:
          name: mb-nursing-home-apk
          path: release-output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "MB Nursing Home HMS ${{ env.VERSION_TAG }}"
          body: |
            ### 🏥 MB Nursing Home Pvt. Ltd. — Android APK Release (${{ env.VERSION_TAG }})

            Automated production build generated by GitHub Actions.

            #### 📦 Included Downloads:
            - **`mb-nursing-home-hms-${{ env.VERSION_TAG }}.apk`**: Direct Android APK installable on any Android phone (Android 7.0+ / SDK 24 - 35).
            - **`mb-nursing-home-hms-latest.apk`**: Always points to this latest build.

            #### 🌟 Features in this release:
            - **Instant Multi-Phone Real-Time Cloud Sync**: Bidirectional sync via Cloud Firestore across all doctors and staff.
            - **Push Notifications Pipeline**: Instant heads-up system alerts with emergency sound and vibration patterns.
            - **Multi-Phone Dispatch Center**: One-tap emergency broadcast system (Code Blue, vital drops, ICU bed alerts, app updates).
            - **Ward & Bed Occupancy**: Live bed status tracking for General Ward, ICU, and Private Cabins.
            - **Companion Web Portal & Service Worker**: Background push alerts even when the browser tab is closed.
            ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            release-output/mb-nursing-home-hms-${{ env.VERSION_TAG }}.apk
            release-output/mb-nursing-home-hms-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
